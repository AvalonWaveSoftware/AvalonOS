# TEST BUILDS ONLY (package avalonos-testseed, AVALONOS_TEST_BUILD=1; never in
# a release repo or on a release ISO). Runs before the first-boot TUI: with
# avalonos.testseed=1 and an AVTESTSEED disk it creates the test user, so
# avalonos-make-user then finds the user-ready marker and exits. A failure
# here is ignored ("-") and the normal TUI runs.
[Service]
ExecStartPre=-/usr/libexec/avalonos/testseed-user
