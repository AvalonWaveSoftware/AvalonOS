# AvalonOS system btop config — used via `btop -c` from the waybar button.
color_theme = "avalonos"
theme_background = True
truecolor = True
force_tty = False
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"
vim_keys = True
rounded_corners = True
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
update_ms = 1000
proc_sorting = "cpu lazy"
proc_tree = False
proc_colors = True
proc_gradient = True
proc_per_core = False
proc_mem_bytes = True
proc_info_smaps = False
proc_left = False
proc_filter_kernel = False
cpu_graph_upper = "Auto"
cpu_graph_lower = "Auto"
cpu_invert_lower = True
cpu_single_graph = False
cpu_bottom = False
show_uptime = True
check_temp = True
cpu_sensor = "Auto"
show_coretemp = True
temp_scale = "celsius"
show_cpu_freq = True
clock_format = "%H:%M"
background_update = True
mem_graphs = True
show_disks = True
only_physical = True
io_mode = False
io_graph_combined = False
show_io_stat = True
net_download = 100
net_upload = 100
net_auto = True
net_sync = True
show_battery = True
show_battery_watts = True
log_level = "WARNING"
