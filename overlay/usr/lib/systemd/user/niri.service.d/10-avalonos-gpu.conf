# Written once per boot by the root service avalonos-gpu-select.service
# (/usr/libexec/avalonos/gpu-select) into root-owned /run/avalonos/gpu.env:
# empty on hardware GL, MESA_LOADER_DRIVER_OVERRIDE=kms_swrast without 3D.
# This EnvironmentFile applies to niri only as a systemd service. niri
# would pass the override to children; config.kdl unsets it for spawns,
# and avalonos-alacritty also unsets it (clients use LIBGL_ALWAYS_SOFTWARE=1
# when gpu.env selected software). Do not add this EnvironmentFile to
# other user units.
[Service]
EnvironmentFile=-/run/avalonos/gpu.env
