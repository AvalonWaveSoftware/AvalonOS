[Unit]
After=avalonos-firstboot-user.service
ConditionPathExists=/var/lib/avalonos/user-ready

[Service]
ExecStartPre=/usr/bin/avalonos-console-setup
# AvalonOS greeter config lives in its own file; greetd's config.toml stays
# the greetd package's (%config(noreplace), untouched).
ExecStart=
ExecStart=/usr/bin/greetd --config /etc/greetd/avalonos.toml
