# AvalonOS installer (P-M1r): shipped in /avalonos/updates.img. Install from
# the pinned system repos in /etc/anaconda.repos.d (closest-mirror source)
# with TLS verification on. The kickstart has no url/--baseurl/--metalink
# source (those would be created without gpgcheck), and its %pre guard
# refuses inst.repo=/inst.addrepo=/inst.noverifyssl.
[Payload]
default_source = CLOSEST_MIRROR
verify_ssl = True
