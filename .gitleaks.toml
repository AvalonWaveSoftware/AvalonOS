# gitleaks config: default rules plus known false positives.
[extend]
useDefault = true

[allowlist]
description = "Treesitter parser git revisions (anchored revision lines only) and the public Fedora key fingerprint"
# AOS-SEC-13: do not path-allowlist parsers.lua; only revision = '<40 hex>' lines.
regexes = [
  '''^36F612DCF27F7D1A48A835E4DBFCF71C6D9F90A6$''',
  '''revision = '[0-9a-f]{40}',''',
]
